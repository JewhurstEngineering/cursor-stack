name: CursorStack
options:
  bundleIdPrefix: dev.jamesware
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6998422DKP
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    COMBINE_HIDPI_IMAGES: YES
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  CursorStack:
    type: application
    platform: macOS
    sources:
      - path: CursorStack
        excludes:
          - "Resources/Assets.xcassets"
    resources:
      - path: CursorStack/Resources/Assets.xcassets
    info:
      path: CursorStack/Info.plist
      properties:
        CFBundleName: CursorStack
        CFBundleDisplayName: CursorStack
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSUserNotificationAlertStyle: banner
        NSScreenCaptureUsageDescription: CursorStack can optionally capture a small region of Cursor windows to detect attention badges. Nothing is uploaded.
    entitlements:
      path: CursorStack/CursorStack.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jamesware.CursorStack
        PRODUCT_NAME: CursorStack
        INFOPLIST_FILE: CursorStack/Info.plist
        CODE_SIGN_ENTITLEMENTS: CursorStack/CursorStack.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
  CursorStackTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CursorStackTests
    dependencies:
      - target: CursorStack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jamesware.CursorStackTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CursorStack.app/Contents/MacOS/CursorStack"
        BUNDLE_LOADER: "$(TEST_HOST)"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
schemes:
  CursorStack:
    build:
      targets:
        CursorStack: all
        CursorStackTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CursorStackTests
